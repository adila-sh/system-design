name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@adila-sh"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Mesma validação do ci.yml, repetida aqui de propósito ──────────────
      #
      # O PR de versão do Changesets NÃO passa pelo CI: a branch
      # `changeset-release/main` é criada pela própria action usando o
      # GITHUB_TOKEN, e o GitHub não dispara workflows em pushes feitos com esse
      # token — é a proteção contra recursão. Na prática, `gh pr checks` naquele
      # PR responde "no checks reported".
      #
      # Sem estes passos, publicar é o único caminho do repositório que sai sem
      # nenhuma verificação. Como o job já roda no push da main, validar aqui
      # cobre tanto o merge normal quanto o merge do PR de versão.
      - name: Install Chromium (Playwright)
        run: bunx playwright install --with-deps chromium

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # Antes do typecheck: o apps/docs resolve @adila-sh/ui pelos tipos em
      # packages/ui/dist. Também deixa o dist pronto para o publish.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
